imports:
  - './tests/behat/config/extension.chrome.yml'
  - './tests/behat/config/extension.drupal.yml'
  - './tests/behat/config/extension.mink.yml'
  #- './tests/behat/config/extension.screenshot.yml'
  - './tests/behat/config/formatters.junit.yml'
  - './tests/behat/config/formatters.pretty.yml'
  - './tests/behat/config/formatters.tap.yml'
  - './tests/behat/config/suites.yml'
  - './behat.local.yml'

default:
  autoload:
    bootstrap: '%paths.base%/features/bootstrap'
  testers:
    strict: true
    rerun_cache: '%paths.base%/.cache/behat/rerun'

  exceptions:
    verbosity: 4
