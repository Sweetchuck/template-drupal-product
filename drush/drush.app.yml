options:
  root: '${drush.vendor-dir}/../docroot'

command:
  core:
    status:
      options:
        format: 'yaml'
    #rsync:
    #  # Example: bin/drush --config=drush core:rsync --exclude-paths='/backup_migrate/*:/css/*:/js/*:/languages/*:/styles/*:/private/*' '@app.prod:%files' "${PWD}/sites/default/backup/legacy/files" -- --delete
    #  options:
    #    # @app.prod:%files /path/to/files
    #    exclude-paths: '/css/*:/js/*:/languages/*:/styles/*:/private/*'

  sql:
    dump:
      options:
        skip-tables-key: 'common'
        structure-tables-key: 'common'

  site:
    install:
      options:
        sites-subdir: 'default'
        site-name: 'Drupal-11.3 product template'
        account-name: 'admin'
        account-pass: 'admin'
        account-mail: 'admin@todo.localhost'

sql:
  skip-tables:
    common: []
  structure-tables:
    common:
      - 'cache'
      - 'cache_*'
      - 'history'
      - 'search_*'
      - 'sessions'
      - 'watchdog'

marvin:
  projectType: 'product'

  runtime_environments:
    host:
      enabled: true

  phpunit:
    testSuite:
      default:
        unit: true

  sites:
    default:
      #id: 'default'
      #enabled: true
      #defaultUri: 'default'
      uriList:
        default:
          uri: 'https://default'
          #languages:
          #  en: -999
